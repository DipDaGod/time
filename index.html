<!DOCTYPE html>
<html lang="en" data-theme="neon" data-size="md">
<head>
<meta charset="UTF-8">
<title>Local Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@300;400;600;700;800&family=Share+Tech+Mono&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@fontsource/dseg7-classic/700.css">
<style>
  :root {
    --scale: 1; --blur: none; --border: none;
    --digit-weight: 900; --digit-tracking: -.02em;
    --date-weight: 400; --date-tracking: .12em; --date-transform: none;
  }

  /* ---------- Neon Glow — near-black purple, magenta bloom, Orbitron ---------- */
  html[data-theme="neon"] {
    --bg1:#1a0a2e; --bg2:#05020a;
    --card: rgba(38,10,58,0.55); --card-top: rgba(55,16,82,0.55); --card-bottom: rgba(24,6,42,0.55);
    --card-line: rgba(255,255,255,0.14);
    --digit:#f6ecff; --accent:#e838d1;
    --font-digit:'Orbitron', 'Arial Black', sans-serif;
    --font-label:'Orbitron', sans-serif;
    --digit-weight:800; --digit-tracking:-.01em;
    --date-weight:600; --date-tracking:.16em; --date-transform:uppercase;
    --radius:16px;
    --card-shadow: 0 0 28px rgba(232,56,209,.35), 0 0 58px rgba(150,50,255,.18), inset 0 0 0 1px rgba(255,255,255,.04);
    --glow: 0 0 10px rgba(246,236,255,.55);
    --border: 1px solid rgba(232,56,209,.55);
  }

  /* ---------- Glassmorph — frosted glass, Inter ---------- */
  html[data-theme="glass"] {
    --bg1:#0c1220; --bg2:#050810;
    --card: rgba(110,130,160,0.16); --card-top: rgba(140,160,190,0.22); --card-bottom: rgba(70,85,110,0.14);
    --card-line: rgba(255,255,255,0.18);
    --digit:#eef4ff; --accent:#9cc6ff;
    --font-digit:'Inter', -apple-system, 'SF Pro Display', sans-serif;
    --font-label:'Inter', sans-serif;
    --digit-weight:700; --digit-tracking:-.02em;
    --date-weight:300; --date-tracking:.28em; --date-transform:none;
    --radius:22px;
    --card-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
    --glow: 0 0 8px rgba(120,170,255,.4);
    --border: 1px solid rgba(255,255,255,.2);
    --blur: blur(18px);
  }

  /* ---------- Retro Amber — warm brown-black, DSEG7 seven-segment ---------- */
  html[data-theme="amber"] {
    --bg1:#241207; --bg2:#0c0602;
    --card:#2a180d; --card-top:#3c2513; --card-bottom:#1c1008;
    --card-line: rgba(0,0,0,.55);
    --digit:#ffbd63; --accent:#ff9a2e;
    --font-digit:'DSEG7 Classic', 'Courier New', monospace;
    --font-label:'Share Tech Mono', 'Courier New', monospace;
    --digit-weight:700; --digit-tracking:.04em;
    --date-weight:400; --date-tracking:.1em; --date-transform:none;
    --radius:8px;
    --card-shadow: 0 10px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.03);
    --glow: 0 0 16px rgba(255,150,45,.6);
  }

  /* ---------- Minimal Mono — flat charcoal, Helvetica Neue / SF Pro ---------- */
  html[data-theme="mono"] {
    --bg1:#141414; --bg2:#141414;
    --card:#1c1c1c; --card-top:#212121; --card-bottom:#171717;
    --card-line: rgba(255,255,255,.08);
    --digit:#e9e9e9; --accent:#9a9a9a;
    --font-digit:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    --font-label:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    --digit-weight:700; --digit-tracking:-.01em;
    --date-weight:500; --date-tracking:.09em; --date-transform:none;
    --radius:10px;
    --card-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.05);
    --glow: none;
    --border: 1px solid rgba(255,255,255,.06);
  }

  /* ---------- Ocean Breeze — deep navy, cyan glass, Manrope ---------- */
  html[data-theme="ocean"] {
    --bg1:#06202f; --bg2:#020d15;
    --card: rgba(10,45,66,0.5); --card-top: rgba(18,65,92,0.5); --card-bottom: rgba(6,28,42,0.5);
    --card-line: rgba(255,255,255,0.14);
    --digit:#eafcff; --accent:#4dd9ec;
    --font-digit:'Manrope', 'Nunito Sans', sans-serif;
    --font-label:'Manrope', sans-serif;
    --digit-weight:700; --digit-tracking:-.01em;
    --date-weight:400; --date-tracking:.2em; --date-transform:none;
    --radius:18px;
    --card-shadow: 0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    --glow: 0 0 10px rgba(90,220,255,.4);
    --border: 1px solid rgba(90,220,255,.35);
    --blur: blur(10px);
  }

  /* ---------- Cyber Grid — black-green HUD, JetBrains Mono ---------- */
  html[data-theme="cyber"] {
    --bg1:#030a05; --bg2:#000000;
    --card: rgba(5,28,16,0.45); --card-top: rgba(8,40,22,0.45); --card-bottom: rgba(3,18,10,0.45);
    --card-line: rgba(0,0,0,.6);
    --digit:#9dffb0; --accent:#4fff8f;
    --font-digit:'JetBrains Mono', 'IBM Plex Mono', 'Space Mono', monospace;
    --font-label:'JetBrains Mono', monospace;
    --digit-weight:700; --digit-tracking:0em;
    --date-weight:500; --date-tracking:.22em; --date-transform:uppercase;
    --radius:4px;
    --card-shadow: 0 0 18px rgba(79,255,143,.18), inset 0 0 0 1px rgba(79,255,143,.1);
    --glow: 0 0 8px currentColor;
    --border: 1px solid rgba(79,255,143,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, var(--bg1) 0%, var(--bg2) 75%);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    transition: background .5s ease;
  }

  /* Cyber Grid HUD lines behind the clock */
  html[data-theme="cyber"] .stage::after {
    content: ""; position: absolute; inset: -35% -25%; z-index: -2; pointer-events: none;
    background-image:
      linear-gradient(rgba(79,255,143,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,255,143,.07) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
  }

  /* ---------- Controls ---------- */
  .controls { position: fixed; top: 1.2rem; right: 1.2rem; z-index: 50; }
  .icon-btn {
    width: 2.5rem; height: 2.5rem; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(18,18,22,0.55); color: #f2f2f2;
    font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: transform .15s ease, background .2s ease;
  }
  .icon-btn:hover { transform: scale(1.08); background: rgba(28,28,34,.75); }
  .icon-btn:active { transform: scale(.95); }

  .panel {
    display: none; flex-direction: column; gap: .9rem;
    position: absolute; top: 3rem; right: 0;
    width: 15.5rem; padding: .85rem .9rem .95rem;
    border-radius: 14px;
    background: rgba(24,24,28,0.86);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 16px 34px rgba(0,0,0,0.4);
  }
  .panel.open { display: flex; }

  .panel-heading {
    font-family: 'Courier New', monospace; font-size: .68rem;
    letter-spacing: .1em; color: rgba(255,255,255,.45);
    padding-bottom: .5rem; margin-bottom: .1rem; border-bottom: 1px solid rgba(255,255,255,.09);
  }

  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .15rem; }
  .swatch-row { display: flex; align-items: center; gap: .5rem; cursor: pointer; padding: .32rem .35rem; border-radius: 8px; }
  .swatch-row:hover { background: rgba(255,255,255,.07); }
  .swatch { width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); flex-shrink: 0; }
  .swatch-label { font-family: 'Courier New', monospace; font-size: .66rem; color: #ddd; }
  .swatch-row.active { background: rgba(255,255,255,.06); }
  .swatch-row.active .swatch-label { color: #fff; font-weight: bold; }
  .swatch-row.active .swatch { box-shadow: 0 0 0 2px rgba(255,255,255,.85); }

  .segmented { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
  .segmented button {
    flex: 1; padding: .4rem .3rem; border: none; cursor: pointer;
    background: rgba(255,255,255,.04); color: #ccc;
    font-family: 'Courier New', monospace; font-size: .66rem; letter-spacing: .04em;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button.active { background: #e0973f; color: #0b0b0c; font-weight: bold; }
  .segmented button:hover:not(.active) { background: rgba(255,255,255,.1); }
  .panel-sub { font-family: 'Courier New', monospace; font-size: .62rem; letter-spacing: .1em; color: rgba(255,255,255,.4); }

  /* ---------- Stage ---------- */
  .stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    transform: scale(var(--scale)); transition: transform .35s ease;
  }
  .stage::before {
    content: ""; position: absolute; z-index: -1; inset: -25% -15%;
    background: radial-gradient(circle at center, var(--accent) 0%, transparent 70%);
    opacity: .16; filter: blur(70px); pointer-events: none;
    transition: opacity .4s ease, background .5s ease;
  }
  html[data-theme="mono"] .stage::before { opacity: 0; }

  .board { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }

  .clock-row { display: flex; align-items: center; gap: clamp(.4rem, 1.2vw, .9rem); }

  .colon { display: flex; flex-direction: column; gap: clamp(.6rem, 1.6vw, 1.1rem); padding: 0 clamp(.1rem, .4vw, .3rem); }
  .colon span {
    width: clamp(6px, .9vw, 10px); height: clamp(6px, .9vw, 10px);
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1s ease-in-out infinite;
    transition: background .5s ease;
  }
  html[data-theme="mono"] .colon span { box-shadow: none; animation: pulseMono 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes pulseMono { 0%, 100% { opacity: .85; } 50% { opacity: .3; } }

  .flip-unit { position: relative; width: clamp(2.2rem, 8vw, 5.5rem); height: clamp(3.4rem, 12vw, 8.2rem); }
  .flip-card {
    position: absolute; inset: 0; border-radius: var(--radius);
    background: var(--card); box-shadow: var(--card-shadow); border: var(--border);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    transition: background .5s ease, border-radius .5s ease, box-shadow .5s ease, border-color .5s ease;
  }
  .flip-card.flip { animation: flap .32s cubic-bezier(.4,0,.2,1); }
  @keyframes flap { 0% { transform: rotateX(0deg); } 45% { transform: rotateX(-12deg); } 100% { transform: rotateX(0deg); } }

  .half { position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden; display: flex; justify-content: center; }
  .half.top {
    top: 0; align-items: flex-start; border-radius: var(--radius) var(--radius) 0 0;
    background: linear-gradient(to bottom, var(--card-top), var(--card) 90%);
    transition: background .5s ease, border-radius .5s ease;
  }
  .half.bottom {
    bottom: 0; align-items: flex-end; border-radius: 0 0 var(--radius) var(--radius);
    background: linear-gradient(to top, var(--card-bottom), var(--card) 90%);
    transition: background .5s ease, border-radius .5s ease;
  }
  .half::after { content:""; position:absolute; left:0; right:0; height:2px; background: var(--card-line); transition: background .5s ease; }
  .half.top::after { bottom: 0; }
  .half.bottom::after { top: 0; }

  .half span {
    display: block; font-size: clamp(2.4rem, 9.5vw, 6.2rem);
    line-height: clamp(3.4rem, 12vw, 8.2rem); color: var(--digit);
    font-family: var(--font-digit); font-weight: var(--digit-weight);
    letter-spacing: var(--digit-tracking); font-variant-numeric: tabular-nums;
    user-select: none; text-shadow: var(--glow); transition: color .5s ease;
  }
  .half.bottom span { margin-top: calc(-1 * clamp(3.4rem, 12vw, 8.2rem)); }

  #date {
    font-family: var(--font-label); color: var(--accent);
    font-weight: var(--date-weight);
    letter-spacing: var(--date-tracking);
    text-transform: var(--date-transform);
    font-size: clamp(.85rem, 1.8vw, 1.15rem);
    transition: color .5s ease;
  }

  html[data-size="sm"] { --scale: .78; }
  html[data-size="md"] { --scale: 1; }
  html[data-size="lg"] { --scale: 1.22; }
</style>
</head>
<body>

  <div class="controls">
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    <div class="panel" id="settingsPanel">
      <div>
        <div class="panel-heading">Design</div>
        <div class="theme-grid" id="themeGrid">
          <div class="swatch-row" data-theme="neon">
            <span class="swatch" style="background:linear-gradient(135deg,#1a0a2e,#e838d1)"></span>
            <span class="swatch-label">Neon Glow</span>
          </div>
          <div class="swatch-row" data-theme="glass">
            <span class="swatch" style="background:linear-gradient(135deg,#0c1220,#9cc6ff)"></span>
            <span class="swatch-label">Glassmorph</span>
          </div>
          <div class="swatch-row" data-theme="amber">
            <span class="swatch" style="background:linear-gradient(135deg,#241207,#ff9a2e)"></span>
            <span class="swatch-label">Retro Amber</span>
          </div>
          <div class="swatch-row" data-theme="mono">
            <span class="swatch" style="background:linear-gradient(135deg,#141414,#9a9a9a)"></span>
            <span class="swatch-label">Minimal Mono</span>
          </div>
          <div class="swatch-row" data-theme="ocean">
            <span class="swatch" style="background:linear-gradient(135deg,#06202f,#4dd9ec)"></span>
            <span class="swatch-label">Ocean Breeze</span>
          </div>
          <div class="swatch-row" data-theme="cyber">
            <span class="swatch" style="background:linear-gradient(135deg,#030a05,#4fff8f)"></span>
            <span class="swatch-label">Cyber Grid</span>
          </div>
        </div>
      </div>
      <div>
        <div class="panel-sub" style="margin-bottom:.35rem;">Size</div>
        <div class="segmented" id="sizeSeg">
          <button data-size="sm">S</button>
          <button data-size="md" class="active">M</button>
          <button data-size="lg">L</button>
        </div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="board">
      <div class="clock-row">
        <div class="flip-unit" id="h0"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="flip-unit" id="h1"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="colon"><span></span><span></span></div>
        <div class="flip-unit" id="m0"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="flip-unit" id="m1"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="colon"><span></span><span></span></div>
        <div class="flip-unit" id="s0"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="flip-unit" id="s1"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
      </div>
      <div id="date"></div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const state = { theme: 'neon', size: 'md' };

  function pad(n) { return n.toString().padStart(2, '0'); }

  function setDigit(id, newVal) {
    const el = document.getElementById(id);
    const card = el.querySelector('.flip-card');
    const spans = el.querySelectorAll('span');
    if (spans[0].textContent === newVal) return;
    card.classList.remove('flip');
    void card.offsetWidth;
    card.classList.add('flip');
    spans.forEach(s => s.textContent = newVal);
  }

  function updateClock() {
    const now = new Date();
    const hh = pad(now.getHours());
    const mm = pad(now.getMinutes());
    const ss = pad(now.getSeconds());
    setDigit('h0', hh[0]); setDigit('h1', hh[1]);
    setDigit('m0', mm[0]); setDigit('m1', mm[1]);
    setDigit('s0', ss[0]); setDigit('s1', ss[1]);
    document.getElementById('date').textContent = new Intl.DateTimeFormat(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    }).format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);

  function applyState() {
    root.setAttribute('data-theme', state.theme);
    root.setAttribute('data-size', state.size);
    document.querySelectorAll('.swatch-row[data-theme]').forEach(r =>
      r.classList.toggle('active', r.dataset.theme === state.theme));
    document.querySelectorAll('#sizeSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.size === state.size));
  }

  document.querySelectorAll('.swatch-row[data-theme]').forEach(row => {
    row.addEventListener('click', () => { state.theme = row.dataset.theme; applyState(); });
  });
  document.querySelectorAll('#sizeSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.size = btn.dataset.size; applyState(); });
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const panel = document.getElementById('settingsPanel');
  settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('open'); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.controls')) panel.classList.remove('open');
  });

  applyState();
</script>
</body>
</html>
