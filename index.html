<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Time</title>
<script>
  // Apply the saved theme/style/size/background to <html> before the body
  // ever paints, so reloading never flashes the default look first.
  (function () {
    var VALID_THEMES = ['flap', 'daylight', 'midnight', 'ink', 'terminal', 'sunset'];
    var VALID_SIZES = ['sm', 'md', 'lg', 'xl'];
    var VALID_BGS = ['radial', 'linear', 'solid'];
    var html = document.documentElement;
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('clockState')); } catch (e) {}
    html.setAttribute('data-theme', (saved && VALID_THEMES.indexOf(saved.theme) !== -1) ? saved.theme : 'flap');
    html.setAttribute('data-style', (saved && saved.style === 'classic') ? 'classic' : 'flip');
    html.setAttribute('data-size', (saved && VALID_SIZES.indexOf(saved.size) !== -1) ? saved.size : 'md');
    html.setAttribute('data-bg', (saved && VALID_BGS.indexOf(saved.bg) !== -1) ? saved.bg : 'radial');
  })();
</script>
<style>
  :root { --radius: 8px; --scale: 1; }

  /* ---------- Themes (set on <html> so they apply before body paints) ---------- */
  /* Flap — the original split-flap board: warm mechanical amber on charcoal */
  html[data-theme="flap"] {
    --bg1:#1c1c1e; --bg2:#0c0c0e;
    --card:#28282b; --card-top:#313134; --card-bottom:#1f1f22;
    --card-line: rgba(0,0,0,.6);
    --digit:#f5efe3; --accent:#e0973f; --accent-dim:#8a5a28;
    --font-digit:'Arial Black', Arial, sans-serif;
    --font-label:'Courier New', monospace;
    --radius: 8px; --glow: none;
  }
  /* Daylight — crisp, modern, high-key */
  html[data-theme="daylight"] {
    --bg1:#fbfbfc; --bg2:#e7ecf1;
    --card:#ffffff; --card-top:#ffffff; --card-bottom:#eef2f5;
    --card-line: rgba(0,0,0,.08);
    --digit:#152029; --accent:#3457d5; --accent-dim:#b7c4f2;
    --font-digit:'Helvetica Neue', Arial, sans-serif;
    --font-label:'Helvetica Neue', Arial, sans-serif;
    --radius: 14px; --glow: none;
  }
  /* Midnight — a calmer, more premium take on neon: indigo glass */
  html[data-theme="midnight"] {
    --bg1:#10123a; --bg2:#040513;
    --card:#181c46; --card-top:#212658; --card-bottom:#12142f;
    --card-line: rgba(0,0,0,.6);
    --digit:#eef1ff; --accent:#7c9bff; --accent-dim:#33397f;
    --font-digit:'Consolas', 'Courier New', monospace;
    --font-label:'Consolas', 'Courier New', monospace;
    --radius: 10px; --glow: 0 0 16px rgba(124,155,255,.5);
  }
  /* Ink — warm paper with an inked stamp accent */
  html[data-theme="ink"] {
    --bg1:#f4f0e4; --bg2:#e4dcc6;
    --card:#faf6ea; --card-top:#fdfaf1; --card-bottom:#f0e9d8;
    --card-line: rgba(0,0,0,.18);
    --digit:#22242c; --accent:#a3242a; --accent-dim:#dcb0b0;
    --font-digit:Georgia, 'Times New Roman', serif;
    --font-label:Georgia, serif;
    --radius: 3px; --glow: none;
  }
  /* Terminal — phosphor CRT green */
  html[data-theme="terminal"] {
    --bg1:#031403; --bg2:#000000;
    --card:#001a00; --card-top:#012601; --card-bottom:#000f00;
    --card-line: rgba(0,0,0,.8);
    --digit:#33ff66; --accent:#33ff66; --accent-dim:#146b2a;
    --font-digit:'Courier New', monospace;
    --font-label:'Courier New', monospace;
    --radius: 0px; --glow: 0 0 8px currentColor;
  }
  /* Sunset — dusk gradient with a coral glow */
  html[data-theme="sunset"] {
    --bg1:#3b1750; --bg2:#150a2c;
    --card:#2b1044; --card-top:#3b1a5c; --card-bottom:#1c0a30;
    --card-line: rgba(0,0,0,.55);
    --digit:#fff3ea; --accent:#ff8b5e; --accent-dim:#8a4530;
    --font-digit:'Segoe UI', Arial, sans-serif;
    --font-label:'Segoe UI', Arial, sans-serif;
    --radius: 16px; --glow: 0 0 18px rgba(255,139,94,.5);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; width: 100%; margin: 0; padding: 0; }

  body {
    min-height: 100vh; min-width: 100vw;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, var(--bg1) 0%, var(--bg2) 75%);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    transition: background 0.5s ease;
  }
  html[data-bg="solid"] body { background: var(--bg2); }
  html[data-bg="linear"] body { background: linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 100%); }

  /* ---------- Clock scale (baseline; fine-tuned live by JS to avoid overflow) ---------- */
  html[data-size="sm"] { --scale: 0.78; }
  html[data-size="md"] { --scale: 1; }
  html[data-size="lg"] { --scale: 1.22; }
  html[data-size="xl"] { --scale: 1.46; }

  /* ---------- Controls ----------
     Chrome (buttons/panel) is intentionally theme-neutral: a dark glass
     overlay that stays legible on top of every background, light or dark. */
  .controls {
    position: fixed; top: 1.2rem; right: 1.2rem; z-index: 50;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem;
    opacity: 1; transition: opacity 0.3s ease;
  }

  .icon-btn {
    width: 2.5rem; height: 2.5rem; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(18,18,22,0.55); color: #f2f2f2;
    font-size: 1.15rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .icon-btn:hover { transform: scale(1.08); background: rgba(28,28,34,0.75); }
  .icon-btn:active { transform: scale(0.95); }

  .panel {
    display: none; flex-direction: column;
    width: 15.5rem; max-height: 82vh; overflow-y: auto;
    padding: 0.75rem 0.9rem 0.9rem;
    border-radius: 14px;
    background: rgba(24,24,28,0.72);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 16px 34px rgba(0,0,0,0.4);
  }
  .panel.open { display: flex; }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 0.55rem; margin-bottom: 0.55rem;
    border-bottom: 1px solid rgba(255,255,255,0.09);
  }
  .panel-heading {
    font-family: 'Courier New', monospace; font-size: 0.72rem;
    letter-spacing: 0.16em; text-transform: uppercase; font-weight: bold; color: #fff;
  }
  .panel-close {
    background: none; border: none; color: rgba(255,255,255,0.5);
    font-size: 1.05rem; line-height: 1; cursor: pointer;
    padding: 0.1rem 0.4rem; border-radius: 6px; transition: color .15s ease, background .15s ease;
  }
  .panel-close:hover { color: #fff; background: rgba(255,255,255,0.1); }

  .panel-section { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.7rem 0; }
  .panel-section:first-of-type { padding-top: 0; }
  .panel-section:last-of-type { padding-bottom: 0; }
  .panel-section + .panel-section { border-top: 1px solid rgba(255,255,255,0.07); }
  .panel-title {
    font-family: 'Courier New', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
  }

  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.15rem; }

  .swatch-row {
    display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
    padding: 0.32rem 0.35rem; border-radius: 8px;
  }
  .swatch-row:hover { background: rgba(255,255,255,0.07); }
  .swatch {
    width: 1.15rem; height: 1.15rem; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0;
  }
  .swatch-label {
    font-family: 'Courier New', monospace; font-size: 0.7rem;
    letter-spacing: 0.03em; color: #ddd; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .swatch-row.active { background: rgba(255,255,255,0.06); }
  .swatch-row.active .swatch-label { color: #fff; font-weight: bold; }
  .swatch-row.active .swatch { box-shadow: 0 0 0 2px rgba(255,255,255,0.85); }

  /* ---------- Searchable timezone picker ---------- */
  .tz-picker { position: relative; }
  .tz-input {
    width: 100%; padding: 0.48rem 0.6rem; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04);
    color: #eee; font-family: 'Courier New', monospace; font-size: 0.72rem;
    letter-spacing: 0.02em; outline: none; transition: border-color 0.15s ease;
  }
  .tz-input::placeholder { color: rgba(255,255,255,0.35); }
  .tz-input:focus { border-color: rgba(255,255,255,0.4); }
  .tz-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    max-height: 11rem; overflow-y: auto;
    background: rgba(18,18,22,0.98); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    display: none; z-index: 5;
  }
  .tz-results.open { display: block; }
  .tz-result {
    padding: 0.4rem 0.6rem; font-family: 'Courier New', monospace; font-size: 0.68rem;
    color: #ddd; cursor: pointer; display: flex; justify-content: space-between; gap: 0.5rem;
  }
  .tz-result:hover { background: rgba(255,255,255,0.08); }
  .tz-offset { color: rgba(255,255,255,0.4); flex-shrink: 0; }
  .tz-current {
    font-family: 'Courier New', monospace; font-size: 0.62rem;
    color: rgba(255,255,255,0.4); letter-spacing: 0.03em;
  }

  .segmented {
    display: flex; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .segmented button {
    flex: 1; padding: 0.42rem 0.3rem; border: none; cursor: pointer;
    background: rgba(255,255,255,0.04); color: #ccc;
    font-family: 'Courier New', monospace; font-size: 0.68rem;
    letter-spacing: 0.04em; text-transform: uppercase;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .segmented button.active { background: var(--accent); color: #0b0b0c; font-weight: bold; }
  .segmented button:hover:not(.active) { background: rgba(255,255,255,0.1); }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .switch-row .swatch-label { color: #ddd; }
  .switch { position: relative; width: 2.4rem; height: 1.3rem; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .slider {
    position: absolute; inset: 0; background: rgba(255,255,255,0.15);
    border-radius: 999px; transition: background 0.2s ease; pointer-events: none;
  }
  .slider::before {
    content: ""; position: absolute; height: 1rem; width: 1rem;
    left: 0.15rem; top: 0.15rem; background: #fff; border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(1.1rem); }

  .reset-all {
    background: none; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.6);
    font-family: 'Courier New', monospace; font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.55rem; border-radius: 8px; cursor: pointer; width: 100%;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .reset-all:hover { color: #fff; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); }

  /* ---------- Stage / ambient glow ---------- */
  .stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    transform: scale(var(--scale)); transition: transform 0.35s ease;
  }
  .stage::before {
    content: ""; position: absolute; z-index: -1; inset: -25% -15%;
    background: radial-gradient(circle at center, var(--accent) 0%, transparent 70%);
    opacity: 0.14; filter: blur(70px); pointer-events: none;
    transition: opacity 0.4s ease, background 0.5s ease;
  }
  body.no-ambient .stage::before { opacity: 0; }

  /* ---------- Flip board ---------- */
  .board { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }

  .eyebrow {
    font-family: var(--font-label); color: var(--accent);
    letter-spacing: 0.5em; font-size: clamp(0.7rem, 1.4vw, 0.95rem);
    text-transform: uppercase; padding-left: 0.5em; text-shadow: var(--glow);
    transition: color 0.5s ease;
  }

  .clock-row { display: flex; align-items: center; gap: clamp(0.4rem, 1.2vw, 0.9rem); }

  .colon {
    display: flex; flex-direction: column; gap: clamp(0.6rem, 1.6vw, 1.1rem);
    padding: 0 clamp(0.1rem, 0.4vw, 0.3rem);
  }
  .colon span {
    width: clamp(6px, 0.9vw, 10px); height: clamp(6px, 0.9vw, 10px);
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent); animation: pulse 1s ease-in-out infinite;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .flip-unit {
    position: relative; width: clamp(2.2rem, 8vw, 5.5rem);
    height: clamp(3.4rem, 12vw, 8.2rem); perspective: 400px;
  }
  .flip-card {
    position: absolute; inset: 0; border-radius: var(--radius);
    background: var(--card);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4), 0 2px 0 rgba(255,255,255,0.04) inset, inset 0 0 0 1px rgba(255,255,255,0.03);
    transform-style: preserve-3d; transform-origin: center;
    transition: background 0.5s ease, border-radius 0.5s ease;
  }
  .flip-card.flip { animation: flap 0.32s cubic-bezier(.4,0,.2,1); }
  @keyframes flap { 0% { transform: rotateX(0deg); } 45% { transform: rotateX(-12deg); } 100% { transform: rotateX(0deg); } }

  .half { position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden; display: flex; justify-content: center; }
  .half.top {
    top: 0; align-items: flex-start; border-radius: var(--radius) var(--radius) 0 0;
    background: linear-gradient(to bottom, var(--card-top), var(--card) 90%);
    transition: background 0.5s ease, border-radius 0.5s ease;
  }
  .half.bottom {
    bottom: 0; align-items: flex-end; border-radius: 0 0 var(--radius) var(--radius);
    background: linear-gradient(to top, var(--card-bottom), var(--card) 90%);
    transition: background 0.5s ease, border-radius 0.5s ease;
  }
  .half::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--card-line); transition: background 0.5s ease; }
  .half.top::after { bottom: 0; }
  .half.bottom::after { top: 0; }

  .half span {
    display: block; font-weight: 900; font-size: clamp(2.4rem, 9.5vw, 6.2rem);
    line-height: clamp(3.4rem, 12vw, 8.2rem); color: var(--digit);
    font-family: var(--font-digit); letter-spacing: -0.02em; user-select: none;
    text-shadow: var(--glow);
    transition: color 0.5s ease;
  }
  .half.bottom span { margin-top: calc(-1 * clamp(3.4rem, 12vw, 8.2rem)); }

  .ampm-badge {
    font-family: var(--font-label); color: var(--accent);
    letter-spacing: 0.15em; font-size: clamp(0.9rem, 2vw, 1.2rem);
    align-self: flex-end; margin-left: 0.3rem; text-shadow: var(--glow);
    transition: color 0.5s ease;
  }

  #date, #classicDate {
    font-family: var(--font-label); color: var(--accent);
    letter-spacing: 0.35em; text-transform: uppercase;
    font-size: clamp(1rem, 2.2vw, 1.5rem); padding-left: 0.35em;
    transition: opacity 0.2s ease, color 0.5s ease;
  }

  /* ---------- Classic style ---------- */
  .classic-clock { display: none; flex-direction: column; align-items: center; gap: 1rem; }
  #classicTime {
    font-size: clamp(3rem, 12vw, 10rem); font-weight: 700; color: var(--digit);
    letter-spacing: 0.05em; font-variant-numeric: tabular-nums;
    font-family: var(--font-digit); user-select: none; white-space: nowrap;
    transition: color 0.5s ease;
  }
  #classicDigits { text-shadow: var(--glow); }
  .classic-ampm {
    font-size: 0.26em; letter-spacing: 0.12em; margin-left: 0.35em;
    color: var(--accent); font-family: var(--font-label); text-shadow: none;
    vertical-align: middle; transition: color 0.5s ease;
  }

  html[data-style="classic"] .board { display: none; }
  html[data-style="classic"] .classic-clock { display: flex; }
</style>
</head>
<body>

  <div class="controls">
    <button class="icon-btn" id="settingsBtn" title="Settings (or press S)">⚙</button>
    <div class="panel" id="settingsPanel">

      <div class="panel-header">
        <span class="panel-heading">Settings</span>
        <button class="panel-close" id="panelCloseBtn" aria-label="Close settings">✕</button>
      </div>

      <div class="panel-section">
        <div class="panel-title">Color Theme</div>
        <div class="theme-grid">
          <div class="swatch-row" data-theme="flap">
            <span class="swatch" style="background:linear-gradient(135deg,#28282b,#e0973f)"></span>
            <span class="swatch-label">Flap</span>
          </div>
          <div class="swatch-row" data-theme="daylight">
            <span class="swatch" style="background:linear-gradient(135deg,#ffffff,#3457d5)"></span>
            <span class="swatch-label">Daylight</span>
          </div>
          <div class="swatch-row" data-theme="midnight">
            <span class="swatch" style="background:linear-gradient(135deg,#181c46,#7c9bff)"></span>
            <span class="swatch-label">Midnight</span>
          </div>
          <div class="swatch-row" data-theme="ink">
            <span class="swatch" style="background:linear-gradient(135deg,#f4f0e4,#a3242a)"></span>
            <span class="swatch-label">Ink</span>
          </div>
          <div class="swatch-row" data-theme="terminal">
            <span class="swatch" style="background:linear-gradient(135deg,#001a00,#33ff66)"></span>
            <span class="swatch-label">Terminal</span>
          </div>
          <div class="swatch-row" data-theme="sunset">
            <span class="swatch" style="background:linear-gradient(135deg,#2b1044,#ff8b5e)"></span>
            <span class="swatch-label">Sunset</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Timezone</div>
        <div class="tz-picker">
          <input type="text" id="tzSearch" class="tz-input" placeholder="Search city or timezone…" autocomplete="off" spellcheck="false">
          <div class="tz-results" id="tzResults"></div>
        </div>
        <div class="tz-current" id="tzCurrent">Showing local time</div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Clock Style</div>
        <div class="segmented" id="styleSeg">
          <button data-style="flip" class="active">Flip Board</button>
          <button data-style="classic">Classic</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Clock Size</div>
        <div class="segmented" id="sizeSeg">
          <button data-size="sm">S</button>
          <button data-size="md" class="active">M</button>
          <button data-size="lg">L</button>
          <button data-size="xl">XL</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Background</div>
        <div class="segmented" id="bgSeg">
          <button data-bg="radial" class="active">Glow</button>
          <button data-bg="linear">Fade</button>
          <button data-bg="solid">Flat</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Time Format</div>
        <div class="segmented" id="formatSeg">
          <button data-format="24" class="active">24h</button>
          <button data-format="12">12h AM/PM</button>
        </div>
        <div class="switch-row" style="margin-top:0.35rem;">
          <span class="swatch-label">Show Seconds</span>
          <label class="switch">
            <input type="checkbox" id="secondsToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="panel-section">
        <div class="switch-row">
          <span class="swatch-label">Show Date</span>
          <label class="switch">
            <input type="checkbox" id="dateToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="segmented" id="dateFormatSeg" style="margin-top:0.35rem;">
          <button data-datefmt="long" class="active">Full</button>
          <button data-datefmt="short">Short</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="switch-row">
          <span class="swatch-label">Ambient Glow</span>
          <label class="switch">
            <input type="checkbox" id="glowToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="panel-section">
        <button class="reset-all" id="resetAllBtn">Reset all settings</button>
      </div>

    </div>
    <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (or press F)">⛶</button>
  </div>

  <div class="stage">
    <div class="board">
      <div class="eyebrow">Local Time</div>
      <div class="clock-row" id="clock-row">
        <div class="flip-unit" id="h0"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="flip-unit" id="h1"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>
        <div class="colon"><span></span><span></span></div>
        <div class="flip-unit" id="m0"><div class="flip-card"><div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div></div></div>

  const VALID_THEMES = ['flap', 'daylight', 'midnight', 'ink', 'terminal', 'sunset'];
  const SIZE_SCALE = { sm: 0.78, md: 1, lg: 1.22, xl: 1.46 };
  const defaultState = {
    theme: 'flap', style: 'flip', format: '24', seconds: true,
    showDate: true, dateFormat: 'long', size: 'md', bg: 'radial',
    glow: true, timezone: ''
  };
  const state = { ...defaultState };

  function pad(n) { return n.toString().padStart(2, '0'); }

  function setDigit(id, newVal) {
    const el = document.getElementById(id);
    const card = el.querySelector('.flip-card');
    const spans = el.querySelectorAll('span');
    if (spans[0].textContent === newVal) return;
    card.classList.remove('flip');
    void card.offsetWidth;
    card.classList.add('flip');
    spans.forEach(s => s.textContent = newVal);
  }

  function updateClock() {
    const now = new Date();
    const tz = state.timezone || undefined;

    const timeParts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).formatToParts(now).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});

    let h24 = parseInt(timeParts.hour, 10);
    const mm = timeParts.minute;
    const ss = timeParts.second;
    const ampm = h24 >= 12 ? 'PM' : 'AM';

    let hh;
    if (state.format === '12') {
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      hh = pad(h12);
    } else {
      hh = pad(h24);
    }

    setDigit('h0', hh[0]); setDigit('h1', hh[1]);
    setDigit('m0', mm[0]); setDigit('m1', mm[1]);
    setDigit('s0', ss[0]); setDigit('s1', ss[1]);

    const dateOptions = state.dateFormat === 'short'
      ? { timeZone: tz, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }
      : { timeZone: tz, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateStr = new Intl.DateTimeFormat(undefined, dateOptions).format(now);
    document.getElementById('date').textContent = dateStr;
    document.getElementById('classicDate').textContent = dateStr;

    const ampmBadge = document.getElementById('ampmBadge');
    if (state.format === '12') {
      ampmBadge.style.display = '';
      ampmBadge.textContent = ampm;
    } else {
      ampmBadge.style.display = 'none';
    }

    let classicStr = `${hh}:${mm}`;
    if (state.seconds) classicStr += `:${ss}`;
    document.getElementById('classicDigits').textContent = classicStr;
    document.getElementById('classicAmpm').textContent = state.format === '12' ? ampm : '';
  }
  updateClock();
  setInterval(updateClock, 1000);

const ALL_ZONES = [...new Set(TIMEZONE_DATA.flatMap(z => z.utc))];
const OFFSET_CACHE = new Map();

const SEARCH_INDEX = TIMEZONE_DATA.flatMap(zone =>
  zone.utc.map(id => ({
    id,
    search: [
      id,
      zone.text,
      zone.value,
      zone.abbr,
      zone.utc.join(" ")
    ].join(" ").toLowerCase()
  }))
);

function zoneDisplayName(zone) {
  return zone.split('/').pop().replace(/_/g, ' ');
}

function zoneOffsetLabel(zone) {
  if (OFFSET_CACHE.has(zone)) return OFFSET_CACHE.get(zone);

  try {
    const value = new Intl.DateTimeFormat("en-US", {
      timeZone: zone,
      timeZoneName: "shortOffset"
    }).formatToParts(new Date()).find(p => p.type === "timeZoneName")?.value || "";

    OFFSET_CACHE.set(zone, value);
    return value;
  } catch {
    return "";
  }
}

const tzSearch = document.getElementById("tzSearch");
const tzResults = document.getElementById("tzResults");

let searchTimer;

tzSearch.addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => renderTzResults(e.target.value), 60);
});

tzSearch.addEventListener("focus", e => renderTzResults(e.target.value));

function renderTzResults(query) {
  tzResults.innerHTML = "";

  const q = query.trim().toLowerCase();

  let matches = !q
    ? ["", ...POPULAR_ZONES.filter(z => z).slice(0, 12)]
    : SEARCH_INDEX
        .filter(z => z.search.includes(q))
        .map(z => z.id)
        .slice(0, 25);

  if (q && ("local".includes(q) || "device".includes(q)))
    matches.unshift("");

  matches.forEach(z => {
    const row = document.createElement("div");
    row.className = "tz-result";

    const label = document.createElement("span");
    label.textContent = z === "" ? "Local (device)" : `${zoneDisplayName(z)} — ${z}`;

    const offset = document.createElement("span");
    offset.className = "tz-offset";
    offset.textContent = z === "" ? "" : zoneOffsetLabel(z);

    row.append(label, offset);

    row.onclick = () => {
      state.timezone = z;
      applyState();
      tzResults.classList.remove("open");
      tzSearch.blur();
    };

    tzResults.appendChild(row);
  });

  tzResults.classList.toggle("open", matches.length > 0);
}

document.addEventListener("click", e => {
  if (!e.target.closest(".tz-picker"))
    tzResults.classList.remove("open");
});

tzSearch.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    tzResults.classList.remove("open");
    e.stopPropagation();
  }
});

function updateEyebrow() {
  document.querySelector(".eyebrow").textContent =
    state.timezone ? zoneDisplayName(state.timezone) : "Local Time";
}

  // Keeps the clock's on-screen size from ever overflowing the viewport,
  // no matter which Clock Size is selected or how narrow the window is.
  function fitToScreen() {
    const activeEl = state.style === 'classic'
      ? document.querySelector('.classic-clock')
      : document.querySelector('.board');
    if (!activeEl) return;
    const naturalWidth = activeEl.offsetWidth;
    const naturalHeight = activeEl.offsetHeight;
    if (!naturalWidth || !naturalHeight) return;
    const baseScale = SIZE_SCALE[state.size] || 1;
    const maxByWidth = (window.innerWidth * 0.92) / naturalWidth;
    const maxByHeight = (window.innerHeight * 0.85) / naturalHeight;
    const applied = Math.min(baseScale, maxByWidth, maxByHeight);
    root.style.setProperty('--scale', applied > 0 ? applied : baseScale);
  }

  function applyState() {
    root.setAttribute('data-theme', state.theme);
    root.setAttribute('data-style', state.style);
    root.setAttribute('data-size', state.size);
    root.setAttribute('data-bg', state.bg);

    document.querySelectorAll('.swatch-row[data-theme]').forEach(r => r.classList.toggle('active', r.dataset.theme === state.theme));
    document.querySelectorAll('#styleSeg button').forEach(b => b.classList.toggle('active', b.dataset.style === state.style));
    document.querySelectorAll('#formatSeg button').forEach(b => b.classList.toggle('active', b.dataset.format === state.format));
    document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.toggle('active', b.dataset.size === state.size));
    document.querySelectorAll('#bgSeg button').forEach(b => b.classList.toggle('active', b.dataset.bg === state.bg));
    document.querySelectorAll('#dateFormatSeg button').forEach(b => b.classList.toggle('active', b.dataset.datefmt === state.dateFormat));

    document.getElementById('secondsToggle').checked = state.seconds;
    document.getElementById('secColon').style.display = state.seconds ? '' : 'none';
    document.getElementById('s0').style.display = state.seconds ? '' : 'none';
    document.getElementById('s1').style.display = state.seconds ? '' : 'none';

    document.getElementById('dateToggle').checked = state.showDate;
    document.getElementById('date').style.display = state.showDate ? '' : 'none';
    document.getElementById('classicDate').style.display = state.showDate ? '' : 'none';
    document.getElementById('dateFormatSeg').style.display = state.showDate ? '' : 'none';

    document.getElementById('glowToggle').checked = state.glow;
    body.classList.toggle('no-ambient', !state.glow);
    if (state.glow) {
      root.style.removeProperty('--glow');
    } else {
      root.style.setProperty('--glow', 'none');
    }

    tzSearch.value = state.timezone ? zoneDisplayName(state.timezone) : '';
    document.getElementById('tzCurrent').textContent = state.timezone
      ? `Showing ${state.timezone} (${zoneOffsetLabel(state.timezone)})`
      : 'Showing local time';
    updateEyebrow();

    try { localStorage.setItem('clockState', JSON.stringify(state)); } catch (e) {}
    refreshIdleMode();
    updateClock();
    fitToScreen();
  }

  try {
    const saved = JSON.parse(localStorage.getItem('clockState'));
    if (saved) {
      if (!VALID_THEMES.includes(saved.theme)) delete saved.theme;
      Object.assign(state, saved);
    }
  } catch (e) {}

  document.querySelectorAll('.swatch-row[data-theme]').forEach(row => {
    row.addEventListener('click', () => { state.theme = row.dataset.theme; applyState(); });
  });
  document.querySelectorAll('#styleSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.style = btn.dataset.style; applyState(); });
  });
  document.querySelectorAll('#formatSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.format = btn.dataset.format; applyState(); });
  });
  document.querySelectorAll('#sizeSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.size = btn.dataset.size; applyState(); });
  });
  document.querySelectorAll('#bgSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.bg = btn.dataset.bg; applyState(); });
  });
  document.querySelectorAll('#dateFormatSeg button').forEach(btn => {
    btn.addEventListener('click', () => { state.dateFormat = btn.dataset.datefmt; applyState(); });
  });
  document.getElementById('secondsToggle').addEventListener('change', (e) => {
    state.seconds = e.target.checked; applyState();
  });
  document.getElementById('dateToggle').addEventListener('change', (e) => {
    state.showDate = e.target.checked; applyState();
  });
  document.getElementById('glowToggle').addEventListener('change', (e) => {
    state.glow = e.target.checked; applyState();
  });
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    Object.assign(state, defaultState);
    applyState();
  });

  // ----- Settings panel toggle -----
  const settingsBtn = document.getElementById('settingsBtn');
  const panel = document.getElementById('settingsPanel');
  const panelCloseBtn = document.getElementById('panelCloseBtn');
  settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('open'); });
  panelCloseBtn.addEventListener('click', () => panel.classList.remove('open'));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.controls')) panel.classList.remove('open');
  });

// ----- Fullscreen -----
const fsBtn = document.getElementById("fullscreenBtn");
const controls = document.querySelector(".controls");

function isFullscreen() {
  return !!document.fullscreenElement ||
         (window.innerWidth >= screen.width - 2 &&
          window.innerHeight >= screen.height - 2);
}

function updateFullscreenUI() {
  const fullscreen = isFullscreen();

  controls.style.display = fullscreen ? "none" : "flex";

  fsBtn.textContent = fullscreen ? "✕" : "⛶";
  fsBtn.title = fullscreen
    ? "Exit fullscreen (or press F)"
    : "Fullscreen (or press F)";
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
    }
  } catch (err) {
    console.error(err);
  }

  updateFullscreenUI();
}

fsBtn.addEventListener("click", toggleFullscreen);

document.addEventListener("fullscreenchange", updateFullscreenUI);
window.addEventListener("resize", updateFullscreenUI);

// ----- Keyboard shortcuts -----
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;

  switch (e.key.toLowerCase()) {
    case "f":
      e.preventDefault();
      toggleFullscreen();
      break;

    case "escape":
      panel.classList.remove("open");
      break;
  }
});

// Initialize
applyState();
updateFullscreenUI();
</script>
</body>
</html>
